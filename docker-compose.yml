services:
  mtproto:
    image: ghcr.io/telemt/telemt:latest
    container_name: mtproto-shop-proxy
    restart: unless-stopped
    working_dir: /etc/telemt
    labels:
      - autoheal=true
    mem_limit: 1g
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "/app/telemt", "healthcheck", "/etc/telemt/config.toml", "--mode", "liveness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
    environment:
      PROXY_PORT: ${PROXY_PORT:-443}
      TLS_DOMAIN: ${TLS_DOMAIN:-www.microsoft.com}
      TLS_DOMAINS: ${TLS_DOMAINS:-www.cloudflare.com,www.apple.com,www.bing.com}
    ports:
      - "${PROXY_PORT:-443}:443/tcp"
    expose:
      - "9091"
    volumes:
      - ./telemt:/etc/telemt:rw

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: mtproto-shop-bot
    restart: unless-stopped
    labels:
      - autoheal=true
    mem_limit: 512m
    mem_reservation: 128m
    depends_on:
      mtproto:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/heartbeats/bot.beat && [ $$(($$(date +%s) - $$(stat -c %Y /app/data/heartbeats/bot.beat))) -lt $${BOT_HEALTHCHECK_MAX_AGE:-180} ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs

  support_bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: mtproto-shop-support-bot
    restart: unless-stopped
    labels:
      - autoheal=true
    mem_limit: 384m
    mem_reservation: 64m
    depends_on:
      mtproto:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$SUPPORT_BOT_TOKEN\" ] || (test -f /app/data/heartbeats/support_bot.beat && [ $$(($$(date +%s) - $$(stat -c %Y /app/data/heartbeats/support_bot.beat))) -lt $${SUPPORT_BOT_HEALTHCHECK_MAX_AGE:-180} ])"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - .env
    command: ["python", "support_bot.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # Watchdog: Docker's restart policy only restarts a container when its process
  # exits. A container that goes "unhealthy" but keeps running (hang, deadlock,
  # stalled network) is left untouched. autoheal watches for unhealthy containers
  # labelled autoheal=true and restarts them.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: mtproto-shop-autoheal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"
      AUTOHEAL_START_PERIOD: "60"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
