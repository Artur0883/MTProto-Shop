services:
  mtproto:
    image: alexbers/mtprotoproxy:stable
    container_name: mtproto-shop-proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', int(os.getenv('PROXY_PORT','443')))); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - .env
    environment:
      PROXY_PORT: ${PROXY_PORT:-443}
      TLS_DOMAIN: ${TLS_DOMAIN:-www.cloudflare.com}
    ports:
      - "${PROXY_PORT:-443}:${PROXY_PORT:-443}/tcp"
    volumes:
      - ./proxy/config:/home/tgproxy/config:ro
    command: ["python3", "mtprotoproxy.py", "/home/tgproxy/config/config.py"]

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: mtproto-shop-bot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/heartbeats/bot.beat && [ $$(($$(date +%s) - $$(stat -c %Y /app/data/heartbeats/bot.beat))) -lt 90 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      PROXY_CONFIG_PATH: /app/proxy/config/config.py
    volumes:
      - ./proxy/config:/app/proxy/config
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs

  support_bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: mtproto-shop-support-bot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$SUPPORT_BOT_TOKEN\" ] || (test -f /app/data/heartbeats/support_bot.beat && [ $$(($$(date +%s) - $$(stat -c %Y /app/data/heartbeats/support_bot.beat))) -lt 90 ])"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - .env
    command: ["python", "support_bot.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
